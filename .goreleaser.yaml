# GoReleaser 配置：三平台（windows/linux/darwin）× amd64 单文件二进制，免 tar
version: 2

builds:
  - main: ./cmd/gavel
    id: gavel
    binary: gavel
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/166176/harness/internal/version.Version={{.Version}}

archives:
  - formats: [binary]
